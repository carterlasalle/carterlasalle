<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Carter LaSalle — systems, security, applied AI</title>
  <desc id="desc">A dark technical banner with a network-inspired geometric pattern.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070A12"/>
      <stop offset="0.58" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#10182B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="0.5" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#60A5FA" stop-opacity=".22"/>
      <stop offset="1" stop-color="#60A5FA" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="22"/></filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#93C5FD" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <circle cx="1030" cy="135" r="230" fill="url(#glow)" filter="url(#soft)"/>
  <g fill="none" stroke-linecap="round">
    <path d="M812 64L948 116L1085 70L1145 176L1034 270L890 250L812 164Z" stroke="#60A5FA" stroke-opacity=".28" stroke-width="1.5"/>
    <path d="M812 164L948 116L1034 270M1085 70L1034 270M890 250L948 116L1145 176" stroke="#A78BFA" stroke-opacity=".18" stroke-width="1"/>
    <path d="M770 293H1150" stroke="url(#accent)" stroke-opacity=".55" stroke-width="2"/>
  </g>
  <g>
    <circle cx="812" cy="64" r="5" fill="#5EEAD4"/>
    <circle cx="948" cy="116" r="7" fill="#60A5FA"/>
    <circle cx="1085" cy="70" r="5" fill="#A78BFA"/>
    <circle cx="1145" cy="176" r="5" fill="#5EEAD4"/>
    <circle cx="1034" cy="270" r="7" fill="#60A5FA"/>
    <circle cx="890" cy="250" r="5" fill="#A78BFA"/>
    <circle cx="812" cy="164" r="4" fill="#F8FAFC"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <text x="70" y="72" fill="#5EEAD4" font-size="16" letter-spacing="3">BUILD / BREAK / UNDERSTAND</text>
    <text x="66" y="158" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="66" font-weight="700" letter-spacing="-2">CARTER LASALLE</text>
    <rect x="70" y="193" width="525" height="2" rx="1" fill="url(#accent)"/>
    <text x="70" y="235" fill="#CBD5E1" font-size="19" letter-spacing="2">SYSTEMS · SECURITY · APPLIED AI</text>
    <text x="70" y="288" fill="#64748B" font-size="15">small attack surfaces  /  explicit failure modes  /  useful strange software</text>
  </g>
</svg>